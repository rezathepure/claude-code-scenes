name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6, 2026-04-25
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck

      # Before the tests, not just before the build: some of them shell out to
      # `bun run build`, and since ripgrep stopped arriving via postinstall a
      # runner has no binaries until this step. --all rather than the host
      # target alone, so the artifact built below is publishable as-is.
      - name: Vendor ripgrep for every target
        run: bun run vendor:ripgrep:all

      - name: Run tests
        run: bun test --isolate

      # Build and RUN the artifact before publishing it.
      #
      # `prepublishOnly` builds during `npm publish`, which meant the thing
      # users download had never been executed by anyone: the publish build
      # (Vite) produces a different dist/ layout from the one developed
      # against (`bun run build`, Bun), and `npm pack` does not trigger
      # `prepublishOnly` — so even inspecting a packed tarball inspected the
      # wrong build. A bundler error would have shipped and only surfaced on
      # a user's machine.
      #
      # `prepublishOnly` still runs and rebuilds; that is deterministic from
      # the same source, and keeps a manual `npm publish` safe.
      - name: Build publish artifact
        run: bun run build:vite

      - name: Smoke test the artifact
        run: |
          npm -v # trusted publishing needs npm >= 11.5.1
          node dist/cli-node.js --version
          test -f dist/cli-bun.js

      # A tarball missing a platform's binary looks fine on the runner and
      # breaks search for whoever installs it, so fail here rather than there.
      - name: Every platform's ripgrep is in the artifact
        run: |
          for d in arm64-darwin x64-darwin arm64-linux x64-linux; do
            test -x "dist/vendor/ripgrep/$d/rg" || { echo "missing dist/vendor/ripgrep/$d/rg"; exit 1; }
          done
          for d in arm64-win32 x64-win32; do
            test -s "dist/vendor/ripgrep/$d/rg.exe" || { echo "missing dist/vendor/ripgrep/$d/rg.exe"; exit 1; }
          done
          du -sh dist/vendor/ripgrep

      # npm rejects republishing a version that already exists, so a tag for a
      # version published by hand would fail the whole run and leave a red mark
      # on a release that actually succeeded. Skip instead — the changelog and
      # GitHub Release below still run, which is the part that was missing.
      - name: Check whether this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "claude-code-scenes@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "claude-code-scenes@${VERSION} is already published — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: this package authenticates by trusted publishing
      # (OIDC), configured on npmjs.com against this repo and this workflow
      # file. There is no NPM_TOKEN secret, so setting it anyway wrote an empty
      # `_authToken=` into .npmrc — enough for npm to fail authentication
      # before it ever attempts the OIDC exchange. `id-token: write` above is
      # what makes the exchange possible.
      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION#v}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..${VERSION}" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, 2026-04-25
        with:
          name: ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.commits }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.inputs.version || github.ref_name }}^...${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, 'rc') || contains(github.event.inputs.version || github.ref_name, 'beta') || contains(github.event.inputs.version || github.ref_name, 'alpha') }}
