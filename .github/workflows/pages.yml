name: Pages

# Builds and deploys the landing page.
#
# The scene demos are regenerated from the engine as part of `site:build`
# rather than being served from committed assets, so a deploy can never show
# an animation the code no longer produces.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/capture-scene.ts"
      - "scripts/render-scene-svg.ts"
      - "scripts/build-site.ts"
      - "scripts/lib/scene-svg.ts"
      - "src/scene/**"
      - "src/themes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a run that is mid-deploy; just queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run site:build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5, 2026-04-25

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v3, 2026-04-25
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4, 2026-04-25
